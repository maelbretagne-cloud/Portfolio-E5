<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-grad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Cadre -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="none" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="2"/>

  <!-- Routeur / Passerelle -->
  <rect x="340" y="50" width="140" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">ROUTEUR / GW</text>

  <!-- Liens -->
  <line x1="400" y1="110" x2="250" y2="190" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="400" y1="110" x2="550" y2="190" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Switch Core / Distribution -->
  <rect x="190" y="190" width="120" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="225" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">SWITCH VLAN 10</text>

  <rect x="490" y="190" width="120" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="550" y="225" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="14" font-weight="bold">SWITCH VLAN 20</text>

  <!-- Liens vers serveurs/postes -->
  <line x1="250" y1="250" x2="250" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="250" x2="550" y2="310" stroke="#64748b" stroke-width="2"/>

  <rect x="180" y="310" width="140" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="340" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">SRV-AD-01 (10.0.10.10)</text>

  <rect x="480" y="310" width="140" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="340" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">SRV-PROXMOX (10.0.20.10)</text>

  <!-- Textes explicatifs -->
  <rect x="220" y="390" width="360" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="400" y="410" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    [PLACEHOLDER] Remplacez par votre schéma Draw.io / Visio (.png, .svg)
  </text>
</svg>
